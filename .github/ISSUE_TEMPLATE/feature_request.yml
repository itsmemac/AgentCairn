name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please describe the problem you are trying to solve first; there is often more than one way to solve it.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What are you doing, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How could it work? Sketches, example commands or mock-ups help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part does it touch?
      multiple: true
      options:
        - Server / MCP tools
        - Dashboard (web UI)
        - brain CLI or Claude Code hooks
        - Graph model / briefings (core)
        - Docker image or deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other approaches, or workarounds you use today.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to help build this.
